# =============================================================================
# Event Sourcing Knowledge Base — External Sources
# =============================================================================
# Add URLs here and re-run `python scripts/ingest.py` to index them.

articles:
  # Foundational
  - url: https://martinfowler.com/eaaDev/EventSourcing.html
    tags: [concepts, foundational]
    description: "Martin Fowler's canonical article on Event Sourcing"

  - url: https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing
    tags: [concepts, patterns, azure]
    description: "Microsoft's Event Sourcing pattern reference"

  - url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs
    tags: [concepts, cqrs, azure]
    description: "Microsoft's CQRS pattern reference"

  - url: https://www.eventstore.com/event-sourcing
    tags: [concepts, eventstoredb]
    description: "EventStoreDB's guide to Event Sourcing"

  # Practical guides
  - url: https://event-driven.io/en/event_sourcing_on_the_whole/
    tags: [concepts, patterns, practical]
    description: "Oskar Dudycz — Event Sourcing on the whole"

  - url: https://event-driven.io/en/how_to_do_events_versioning/
    tags: [patterns, versioning]
    description: "Oskar Dudycz — How to handle event versioning"

  - url: https://www.eventstore.com/blog/what-is-event-sourcing
    tags: [concepts, beginner]
    description: "EventStore — What is Event Sourcing?"

github_repos:
  # Event Stores & Frameworks
  - url: https://github.com/EventStore/EventStore
    tags: [eventstoredb, database, dotnet]
    description: "EventStoreDB — purpose-built database for event sourcing"
    clone: false  # Storage engine internals, not ES pattern code

  - url: https://github.com/JasperFx/marten
    tags: [marten, dotnet, postgresql]
    description: "Marten — .NET document DB and event store on PostgreSQL"
    code_paths: ["src/samples/", "src/Marten/Events/"]  # Core is storage engine; scope to samples + event sourcing core

  - url: https://github.com/commanded/commanded
    tags: [commanded, elixir, cqrs]
    description: "Commanded — CQRS/ES framework for Elixir"

  - url: https://github.com/AxonFramework/AxonFramework
    tags: [axon, java, spring, cqrs]
    description: "Axon Framework — CQRS and Event Sourcing for Java/Spring"

  - url: https://github.com/eventuous/eventuous
    tags: [eventuous, dotnet, csharp]
    description: "Eventuous — Event Sourcing library for .NET"

  - url: https://github.com/thalo-rs/thalo
    tags: [rust, cqrs]
    description: "Thalo — Event Sourcing & CQRS framework for Rust"

  - url: https://github.com/eventsourcing/es4j
    tags: [java, cqrs]
    description: "ES4J — Event capture and querying for Java"
    clone: false  # Event capture/storage engine, not pattern examples

  - url: https://github.com/prooph/event-store
    tags: [php, event-store]
    description: "Prooph Event Store — PHP event sourcing components"

  # Example / Learning Repositories
  - url: https://github.com/oskardudycz/EventSourcing.NetCore
    tags: [dotnet, csharp, examples, beginner]
    description: "Oskar Dudycz's .NET Event Sourcing examples & exercises"

  - url: https://github.com/oskardudycz/EventSourcing.JVM
    tags: [java, kotlin, examples, beginner]
    description: "Oskar Dudycz's JVM Event Sourcing examples"

  - url: https://github.com/oskardudycz/EventSourcing.NodeJS
    tags: [nodejs, typescript, examples, beginner]
    description: "Oskar Dudycz's Node.js Event Sourcing examples"

  - url: https://github.com/eventmodeling/eventmodeling.org
    tags: [event-modeling, design, concepts]
    description: "Event Modeling — methodology for designing event-driven systems"
    clone: false  # Website/documentation repo, no ES code

  # Python
  - url: https://github.com/pyeventsourcing/eventsourcing
    tags: [python, library]
    description: "Python eventsourcing library — mature ES toolkit for Python"

  # Node / TypeScript
  - url: https://github.com/castore-dev/castore
    tags: [typescript, library]
    description: "Castore — TypeScript library for Event Sourcing"

  - url: https://github.com/ocoda/event-sourcing
    docs: https://ocoda.github.io/event-sourcing/start/repositories
    tags: [nestjs, typescript, library]
    description: "Ocoda Event Sourcing — NestJS ES library (good docs, less actively maintained)"

  - url: https://github.com/NickTsitlakidis/event-nest
    tags: [nestjs, typescript, library, postgresql, mongodb]
    description: "EventNest — NestJS event sourcing library with PostgreSQL & MongoDB support"
